<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Duyệt Job UTC+7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one working column (max 1080px) under a sticky tab bar; job detail replaces the list.
   Signature: a 24-hour ICT ribbon with the 00:00–07:00 night band, on every job. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#e9edf1; --ink:#14202b; --muted:#5b6876; --line:#d7dee5;
  --accent:#16627d; --accent-ink:#ffffff; --accent-soft:#dcedf3;
  --night:#2a3550; --night-soft:#c9d0de;
  --ok:#1d7a4c; --ok-soft:#dcf1e5; --warn:#a86512; --warn-soft:#fbecd6; --bad:#b4322a; --bad-soft:#f8e1de;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#161e26; --sunk:#1d2731; --ink:#e4eaf0; --muted:#97a5b3; --line:#2a3642;
  --accent:#5fb4d2; --accent-ink:#06202a; --accent-soft:#16323e; --night:#8fa0c4; --night-soft:#2b3550;
  --ok:#5cc58e; --ok-soft:#173527; --warn:#e3a54f; --warn-soft:#3a2a12; --bad:#ef8a80; --bad-soft:#3b1d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#161e26; --sunk:#1d2731; --ink:#e4eaf0; --muted:#97a5b3; --line:#2a3642;
  --accent:#5fb4d2; --accent-ink:#06202a; --accent-soft:#16323e; --night:#8fa0c4; --night-soft:#2b3550;
  --ok:#5cc58e; --ok-soft:#173527; --warn:#e3a54f; --warn-soft:#3a2a12; --bad:#ef8a80; --bad-soft:#3b1d1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);margin:0}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;text-wrap:balance;margin:0}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:18px 64px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;letter-spacing:-.01em}
.brand .mono{font-size:.8rem;color:var(--accent);font-weight:600}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.tab:hover{color:var(--ink)}
.status{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.78rem;color:var(--muted);background:var(--surface)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}

/* generic blocks */
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel>h3{margin-bottom:10px}
.lead{max-width:62ch}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input[type=text],input[type=url],input[type=number],input[type=password],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;color:var(--ink)}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.9rem}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;max-width:calc(100% - 32px);font-size:.9rem}
.busy{display:flex;align-items:center;gap:10px;color:var(--muted)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* verdict pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.verify{background:var(--warn-soft);color:var(--warn)}
.pill.reject{background:var(--bad-soft);color:var(--bad)}
.pill.st{background:var(--sunk);color:var(--muted);font-weight:500}

/* job cards */
.jobs{display:flex;flex-direction:column;gap:10px}
.job{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;width:100%}
.job:hover{border-color:var(--accent)}
.job.filtered{opacity:.78}
.score{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;background:var(--sunk);font-family:var(--mono);font-weight:600;font-size:1.15rem}
.score.hi{background:var(--ok-soft);color:var(--ok)}
.score.mid{background:var(--warn-soft);color:var(--warn)}
.job-main{min-width:0;display:flex;flex-direction:column;gap:6px}
.job-title{font-weight:600;overflow-wrap:anywhere}
.job-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* 24h ICT ribbon */
.ribbon{display:block;width:100%;height:30px}
.ribbon.big{height:46px}
.rb-night{fill:var(--night-soft)}
.rb-track{fill:var(--sunk)}
.rb-win{opacity:.9}
.rb-win.ok{fill:var(--ok)} .rb-win.verify{fill:var(--warn)} .rb-win.reject{fill:var(--bad)}
.rb-tick{stroke:var(--line)} .rb-lab{fill:var(--muted);font:10px var(--mono)}
.rb-nlab{fill:var(--night);font:600 9px var(--mono)}

.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.85rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* links grid */
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:8px}
.site{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-decoration:none;color:var(--ink);background:var(--surface)}
.site:hover{border-color:var(--accent)}
.site b{font-weight:600}
.kw{display:flex;gap:6px;flex-wrap:wrap}
.kw button{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface);cursor:pointer;font-size:.85rem}
.kw button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* detail */
.dhead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.dhead .t{flex:1;min-width:0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin:3px 0}
.diff{display:flex;flex-direction:column;gap:10px}
.dl{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.dl .src{font-size:.82rem;color:var(--muted);margin-top:4px}
.dl.drop{border-color:var(--bad);background:var(--bad-soft)}
.tag{font:600 .7rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.cvprev{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;font-size:.86rem;line-height:1.45;overflow-x:auto}
.cvprev h4{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:3px;margin:14px 0 6px}
.cvprev .ent{display:flex;justify-content:space-between;gap:12px;font-weight:600;margin-top:6px;flex-wrap:wrap}
.cvprev ul{margin:2px 0 4px;padding-left:18px}
.checks{display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.checks .okc{color:var(--ok)} .checks .badc{color:var(--bad)}
.copyrow{display:flex;gap:6px;flex-wrap:wrap}
.copyrow button{border:1px dashed var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.85rem}

/* tracking */
.funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:8px}
.fn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fn b{display:block;font:600 1.5rem var(--mono)}
.fn span{font-size:.8rem;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.9rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
details>summary{cursor:pointer;color:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
</style>
<style>
.method{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 8px;font-size:.78rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.method.manual{background:var(--sunk);color:var(--muted)}
.qrow{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.qrow.need{border-color:var(--bad);background:var(--bad-soft)}
.qrow .lab{font-weight:500;font-size:.92rem}
.req{color:var(--bad);font-weight:700}
.bul{display:flex;gap:8px;align-items:flex-start}
.bul textarea{min-height:58px}
.warn-line{font-size:.8rem;color:var(--bad)}
.sticky-actions{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.runs{display:flex;flex-direction:column;gap:4px;font-size:.85rem}
.res-ok{color:var(--ok)} .res-man{color:var(--warn)} .res-bad{color:var(--bad)}
</style>

<header class="top"><div class="top-in">
  <div class="brand">Duyệt Job <span class="mono">UTC+7</span></div>
  <nav class="tabs" id="tabs" aria-label="Màn hình">
    <button class="tab" data-view="pending">Chờ duyệt</button>
    <button class="tab" data-view="history">Lịch sử</button>
    <button class="tab" data-view="settings">Cài đặt</button>
  </nav>
  <div class="status" id="status"></div>
</div></header>
<main class="wrap" id="main"><div class="busy"><div class="spin"></div>Đang mở…</div></main>
<div id="toast" class="toast" hidden></div>

      const v = verdicts && verdicts[String(i)];

      const items = kept.filter((r) => r.label === `skills:${gi}:${g.group || ""}`).map((r) => r.text);

  function originalFinal(cv) {
    return {
      summary: (cv.summary?.sentences || []).map((s) => s.text),
      skills: (cv.skills?.groups || []).map((g) => [g.name, g.items.map((i) => i.text)]),
      experience: (cv.experience?.entries || []).map((e) => ({ id: e.id, bullets: e.bullets.map((b) => b.text) })),
      education: (cv.education?.entries || []).map((e) => ({ id: e.id, details: e.details.map((d) => d.id) })),
      other_sections: (cv.other || []).map((s) => ({ key: s.key, items: s.items.map((i) => i.id) })),

  }
  function buildModel(cv, final, extraLinks) {
    final = final || originalFinal(cv);
    const idx = C().sourceIndex(cv);
    const titles = { summary: cv.summary?.title || "SUMMARY", skills: cv.skills?.title || "SKILLS", experience: cv.experience?.title || "WORK EXPERIENCE", education: cv.education?.title || "EDUCATION" };
    const otherT = Object.fromEntries((cv.other || []).map((s) => [s.key, s.title]));
    const exp = Object.fromEntries((cv.experience?.entries || []).map((e) => [e.id, e]));
    const edu = Object.fromEntries((cv.education?.entries || []).map((e) => [e.id, e]));

    (final.other_sections || []).forEach((s) => { if (!order.includes(s.key)) order.push(s.key); });

    for (const key of order) {
      if (key === "summary" && final.summary.length) sections.push({ title: titles.summary, type: "paragraph", text: final.summary.join(" ") });

      else if (key === "education" && final.education.length)
        sections.push({ title: titles.education, type: "entries", entries: final.education.map((fe) => ({ title: edu[fe.id].title, org: "", dates: edu[fe.id].dates, lines: fe.details.map((d) => idx[d].text) })) });
      else { const s = (final.other_sections || []).find((x) => x.key === key); if (s) sections.push({ title: otherT[s.key] || s.key.toUpperCase(), type: "list", items: s.items.map((i) => idx[i].text) }); }
    }

    return { name: c.name, contact: [c.location, c.phone, c.email, ...(c.links || []), ...(extraLinks || [])].filter(Boolean), sections, doc_title: `CV ${c.name}` };
  }
  function modelWords(m) {
    let n = 0;
    for (const s of m.sections) {
      if (s.type === "paragraph") n += s.text.split(/\s+/).length;
      else if (s.type === "skills") n += s.groups.reduce((a, [nm, it]) => a + it.join(" ").split(/\s+/).length + nm.split(/\s+/).length, 0);
      else if (s.type === "list") n += s.items.reduce((a, i) => a + i.split(/\s+/).length, 0);
      else if (s.type === "entries") for (const e of s.entries) n += `${e.title} ${e.org || ""} ${e.dates || ""}`.split(/\s+/).filter(Boolean).length + [...(e.lines || []), ...(e.bullets || [])].reduce((a, x) => a + x.split(/\s+/).length, 0);
    }

  }
  function trimOnce(final) {

  // ================================================================ cover letter
  function tzSentence(tz, avail) {
    const a = String(avail || "08:00-23:00").replace(/[–—]/, " to ").replace("-", " to ");
    tz = tz || {};
    let win = "";
    for (const d of tz.details || []) if (d.hours_ict) { win = d.hours_ict.split(" (")[0].replace(" ICT", ""); break; }
    if (!win && tz.hours_ict) win = tz.hours_ict.split(" (")[0].replace(" ICT", "");
    win = win.replace(/–/g, " to ");
    const lab = tz.label || "";
    if (tz.verdict === "ok" && lab.startsWith("Overlap") && win) return `I'm based in Vietnam (UTC+7) and can reliably cover ${win} ICT each working day for overlap with your team, then handle the rest asynchronously.`;
    if (tz.verdict === "ok" && win) return `I'm based in Vietnam (UTC+7). Your working hours fall at ${win} ICT on my side, which fits my normal working day (${a} ICT).`;
    if (tz.verdict === "ok" && lab.includes("UTC+7")) return "I'm based in Vietnam (UTC+7), so I share your team's time zone and working day.";
    if (tz.verdict === "ok") return `I'm based in Vietnam (UTC+7). I work well asynchronously and can be online ${a} ICT for meetings and real-time work.`;

  const bodyWords = (ps) => ps.reduce((a, p) => a + p.split(/\s+/).filter(Boolean).length, 0);
  function checkLetter(paragraphs, cv, job, missing, years) {
    const idx = C().sourceIndex(cv);

    const text = paragraphs.join("\n");
    const problems = [];
    const scrub = text.replace(/\b\d{1,2}[:.]\d{2}\b|UTC\s?[+-]\s?\d+|GMT\s?[+-]\s?\d+|\b(?:19|20)\d{2}\b/g, " ");

  function templateLetter(job, cv, final, tz, avail) {

    if (degree) p1 += ` My ${degree} taught me to work in a structured, careful way, and I like turning raw information into findings that people can act on.`;

  // ================================================================ pasted job (no AI)

(function (JT) {

  }
  const warnHtml = (ws) => (ws.length ? `<div class="warn-line">⚠ ${H(ws.join("; "))}</div>` : "");
  function formPanel(j, e) {
    const fs = j.form.fields;
    const std = fs.filter((f) => f.kind.startsWith("std:") || f.kind === "resume" || f.kind === "cover");
    const qs = fs.filter((f) => f.kind === "question"), cons = fs.filter((f) => f.kind === "consent"), eeo = fs.filter((f) => f.kind === "eeo");
    const input = (f) => {
      const v = e.form_values[f.sel] ?? "";
      if ((f.options || []).length) return `<select data-fv="${H(f.sel)}"><option value=""></option>${f.options.map((o) => `<option ${o === v ? "selected" : ""}>${H(o)}</option>`).join("")}</select>${String(v).includes("[ĐIỀN TAY") ? `<div class="warn-line">${H(v)}</div>` : ""}`;
      return `<textarea data-fv="${H(f.sel)}" style="min-height:${f.type === "textarea" ? 100 : 44}px">${H(String(v).includes("[ĐIỀN TAY") ? "" : v)}</textarea>${String(v).includes("[ĐIỀN TAY") ? `<div class="warn-line">${H(v)}</div>` : ""}`;

      <div class="small muted">Tự điền: ${std.map((f) => `${H(f.label.replace(/\s*\*$/, ""))}${f.value ? `: <span class="mono">${H(f.value)}</span>` : ""}`).join(" · ")}</div>
      ${qs.length ? `<b class="small">Câu hỏi (AI soạn nháp, bạn sửa nếu cần)</b>${qs.map((f) => { const v = e.form_values[f.sel]; const need = f.required && (!v || String(v).includes("[ĐIỀN TAY"));
        return `<div class="qrow ${need ? "need" : ""}"><div class="lab">${H(f.label.replace(/\s*\*$/, ""))} ${f.required ? `<span class="req">*</span>` : ""}</div>${input(f)}</div>`; }).join("")}` : ""}
      ${eeo.length ? `<b class="small">Câu hỏi khảo sát (không bắt buộc)</b>${eeo.map((f) => `<div class="qrow"><div class="lab">${H(f.label)}</div>${input(f)}</div>`).join("")}` : ""}
      ${cons.map((f) => `<label class="row small"><input type="checkbox" data-fv="${H(f.sel)}" ${e.form_values[f.sel] ? "checked" : ""}> ${H(f.label)}</label>`).join("")}
    </section>`;

  function checksHtml(problems, words) {
    const ok = (t) => `<div class="okc">✓ ${H(t)}</div>`, bad = (t) => `<div class="badc">✕ ${H(t)}</div>`;
    const dash = problems.filter((p) => /dash|gạch/.test(p)), ai = problems.filter((p) => p.startsWith("cụm từ")), other = problems.filter((p) => !dash.includes(p) && !ai.includes(p) && !p.startsWith("độ dài"));
    return [(words >= 250 && words <= 350 ? ok : bad)(`${words} từ (yêu cầu 250–350)`), dash.length ? bad("Có em dash, cần bỏ") : ok("Không có em dash"),
      ai.length ? bad("Có từ dễ bị nhận là văn AI: " + ai.map((p) => p.replace(/^cụm từ /, "")).join(", ")) : ok("Không có từ ngữ kiểu AI"), ok("Không có dòng ngày tháng"), ...other.map(bad)].join("");
  }
  const emailChecks = (body) => { const p = core.styleProblems(body); return p.length ? `<div class="badc">✕ ${H(p.join(", "))}</div>` : `<div class="okc">✓ Không có em dash hay từ kiểu AI</div>`; };
  function cvPreview(m) {
    let h = `<div style="font-weight:700;font-size:1.1rem">${H(m.name)}</div><div class="muted small">${H(m.contact.join(" | "))}</div>`;
    for (const s of m.sections) {
      h += `<h4>${H(s.title)}</h4>`;
      if (s.type === "paragraph") h += `<div>${H(s.text)}</div>`;
      else if (s.type === "skills") h += s.groups.map(([n, it]) => `<div>${n ? `<b>${H(n)}:</b> ` : ""}${H(it.join(", "))}</div>`).join("");
      else if (s.type === "list") h += `<ul>${s.items.map((i) => `<li>${H(i)}</li>`).join("")}</ul>`;
      else h += s.entries.map((e) => `<div class="ent"><span>${H(e.title)}${e.org ? " | " + H(e.org) : ""}</span><span class="mono">${H(e.dates)}</span></div>${(e.lines || []).map((l) => `<div>${H(l)}</div>`).join("")}${(e.bullets || []).length ? `<ul>${e.bullets.map((b) => `<li>${H(b)}</li>`).join("")}</ul>` : ""}`).join("");
    }
    return h;
  }

  // ------------------------------------------------------------ history / settings
  function viewHistory() {
    const items = S.history.items || [];

      ${items.length ? `<div class="jobs">${items.map((it) => {

          ${["applied", "interview", "approved"].includes(it.status) ? `<div class="row">${[["interview", "Phỏng vấn"], ["offer", "Offer"], ["rejected", "Bị từ chối"]].concat(it.status === "approved" ? [["applied", "Tôi đã nộp tay"]] : [])
            .map(([s, l]) => `<button class="btn ghost" data-act="setstatus" data-id="${H(it.id)}" data-s="${s}">${l}</button>`).join("")}</div>` : ""}</div>`;
      }).join("")}</div>` : `<div class="empty">Chưa có đơn nào.</div>`}${runsHtml()}</div>`;
  }
  function kwSection() {
    if (!S.kw) return `<section class="panel stack"><h3>Từ khoá tìm kiếm</h3><p class="muted small" style="margin:0">Các chức danh tool dùng để tìm job. Bạn thêm từ khoá, AI tự đề xuất thêm chức danh liên quan.</p>
      <div><button class="btn" data-act="load-kw">Mở danh sách từ khoá</button></div></section>`;
    const d = S.kw.doc, K = JT.kw;
    const users = K.userTitles(d), sugg = d.ai_suggested_titles;
    const nPending = users.filter((u) => K.pending(d, u.title)).length;
    const chip = (t, act, extra = "") => `<span class="chip" style="color:var(--ink)">${H(t)}${extra}<button class="btn ghost" style="padding:0 4px;min-height:0;border:0" title="Xoá" data-act="${act}" data-t="${H(t)}">✕</button></span>`;
    const bySeed = {};
    for (const s of sugg) (bySeed[s.from || ""] = bySeed[s.from || ""] || []).push(s);
    return `<section class="panel stack"><div class="row" style="justify-content:space-between"><h3>Từ khoá tìm kiếm</h3>${S.kwDirty ? `<span class="pill verify">Chưa lưu</span>` : ""}</div>
      <div class="stack" style="gap:8px"><b>Chức danh bạn muốn tìm</b>
        <div class="row" style="flex-wrap:wrap;gap:6px">${users.map((u) => chip(u.title, "kw-del", K.pending(d, u.title) ? ` <span class="pill verify" title="AI sẽ đề xuất chức danh liên quan ở lần quét tới">AI sẽ mở rộng</span>` : "")).join("") || `<span class="muted small">Chưa có</span>`}</div>
        <div class="row"><input type="text" id="kw-new" placeholder="Ví dụ: Customer Success" style="flex:1;min-width:180px"><button class="btn" data-act="kw-add">Thêm</button></div>
        <p class="muted small" style="margin:0">Tool tìm job có tiêu đề chứa đủ các từ trong chức danh (không phân biệt hoa thường). Với mỗi từ khoá mới, ở lần quét tới AI sẽ đề xuất thêm 3–8 chức danh liên quan.</p></div>
      <div class="stack" style="gap:8px"><b>AI đề xuất (${sugg.length})</b>

          ${list.map((s) => `<div class="row" style="justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:4px"><div><span>${H(s.title)}</span>${s.why ? ` <span class="muted small">· ${H(s.why)}</span>` : ""}</div>
            <div class="row" style="gap:4px"><button class="btn ghost" data-act="kw-keep" data-t="${H(s.title)}" title="Chuyển sang danh sách của bạn">Giữ</button><button class="btn ghost" data-act="kw-drop" data-t="${H(s.title)}" title="Xoá, AI sẽ không đề xuất lại">✕</button></div></div>`).join("")}</div>`).join("")
        : `<span class="muted small">${nPending ? "AI sẽ đề xuất ở lần quét tới." : "Chưa có. Thêm từ khoá ở trên để AI đề xuất."}</span>`}
        <p class="muted small" style="margin:0">Chức danh AI đề xuất cũng được dùng để tìm. Bấm ✕ để xoá, AI sẽ không đề xuất lại chức danh đó. Xoá một từ khoá của bạn thì các đề xuất từ nó cũng mất.</p></div>
      <div class="stack" style="gap:8px"><b>Loại job có tiêu đề chứa</b>

        <div class="row"><input type="text" id="kw-ex" placeholder="Ví dụ: Senior" style="flex:1;min-width:180px"><button class="btn" data-act="kw-exadd">Thêm</button></div></div>
      <div class="row"><button class="btn primary" data-act="kw-save" ${S.busy.kw ? "disabled" : ""}>Lưu</button><button class="btn" data-act="kw-save" data-scan="1" ${S.busy.kw ? "disabled" : ""}>Lưu và quét ngay</button>
        ${S.kwDirty ? `<button class="btn ghost" data-act="load-kw">Huỷ thay đổi</button>` : ""}</div>
      <details><summary class="small muted">Sửa trực tiếp file keywords.yaml (nâng cao)</summary><div class="stack" style="margin-top:8px">
        <textarea id="kw-text" style="min-height:280px;font-family:var(--mono);font-size:.82rem">${H(S.kwText || "")}</textarea><div><button class="btn" data-act="save-kw">Lưu file</button></div></div></details></section>`;

      ${S.cfgText == null ? `<button class="btn" data-act="load-cfg">Mở để sửa</button>` : `<textarea id="cfg-text" style="min-height:360px;font-family:var(--mono);font-size:.82rem">${H(S.cfgText)}</textarea><div><button class="btn primary" data-act="save-cfg">Lưu lên repo</button></div>`}</section>
      <section class="panel stack"><h3>Kết nối</h3><div class="small">${H(S.gh.owner)}/${H(S.gh.repo)} · nhánh ${H(S.gh.branch)}</div><div><button class="btn danger" data-act="disconnect">Ngắt kết nối và xoá token khỏi trình duyệt này</button></div></section></div>`;

  // ============================================================ actions
  function decision(j, action) {
    const e = ed(j);
    const d = { id: j.id, action, decided_at: new Date().toISOString() };
    if (action === "approve") {
      if (e.touched.cover) d.cover = e.cover;
      if (e.touched.final) d.final = e.final;
      if (e.email) d.email = e.email;
      if (j.form) d.form_values = e.form_values;
    }
    return d;
  }
  async function decide(j, action) {
    S.busy.decide = true; render();
    try {
      await gh.put(`state/decisions/${j.id}.json`, JSON.stringify(decision(j, action), null, 1), `${action === "approve" ? "Duyệt" : "Bỏ qua"}: ${j.title} @ ${j.company}`);
      S.queue.jobs = S.queue.jobs.filter((x) => x.id !== j.id);
      delete S.edits[j.id]; saveEdits();
      S.view = "pending"; S.confirm = null;
      toast(action === "approve" ? "Đã duyệt. GitHub đang xử lý, bạn sẽ nhận email kết quả." : "Đã bỏ qua", 4500);
      setTimeout(async () => { S.runs = await gh.runs().catch(() => S.runs); render(); }, 6000);
    } catch (e) { toast(e.message, 6000); }
    S.busy.decide = false; render();
  }
  document.addEventListener("click", async (ev) => {
    const t = ev.target.closest("[data-view],[data-act]");
    if (!t) return;
    if (t.dataset.view) { S.view = t.dataset.view; S.confirm = null; render(); window.scrollTo(0, 0); return; }
    const a = t.dataset.act, j = S.queue && S.queue.jobs.find((x) => x.id === (t.dataset.id || S.jobId));
    if (a === "connect") {
      const g = { owner: $("#g-owner").value.trim(), repo: $("#g-repo").value.trim(), branch: $("#g-branch").value.trim() || "main", token: $("#g-token").value.trim() };
      if (!g.owner || !g.repo || !g.token) return toast("Điền đủ owner, repo và token");
      S.gh = g; JT.LS.set("jt.gh", g); await load();
    } else if (a === "disconnect") { S.gh = null; JT.LS.set("jt.gh", null); S.queue = null; render(); }
    else if (a === "reload") { await load(); }
    else if (a === "open") { S.view = "job"; S.jobId = t.dataset.id; S.confirm = null; render(); window.scrollTo(0, 0); }
    else if (a === "back") { S.view = "pending"; render(); }
    else if (a === "cv-edit") { S.busy.cvEdit = S.busy.cvEdit === j.id ? null : j.id; render(); }
    else if (a === "del-sum" && j) { const e = ed(j); e.final.summary.splice(+t.dataset.i, 1); e.touched.final = true; saveEdits(); render(); }
    else if (a === "del-bul" && j) { const e = ed(j); e.final.experience[+t.dataset.k].bullets.splice(+t.dataset.i, 1); e.touched.final = true; saveEdits(); render(); }
    else if (a === "approve" && j) {
      if (S.confirm !== j.id) { S.confirm = j.id; render(); return; }
      await decide(j, "approve");
    } else if (a === "skip" && j) { await decide(j, "skip"); }
    else if (a === "file") {
      try { const p = t.dataset.path; toast("Đang tải…"); const b = await gh.blob(p); await JT.download(p.split("/").pop(), b); } catch (e) { toast(e.message, 5000); }
    } else if (a === "dispatch") {
      S.busy.dispatch = true; render();
      try { await gh.dispatch(t.dataset.wf); toast("Đã yêu cầu GitHub quét ngay. Khoảng 5–15 phút sau bấm Làm mới.", 5000); setTimeout(async () => { S.runs = await gh.runs().catch(() => S.runs); render(); }, 5000); }
      catch (e) { toast(e.message, 6000); }
      S.busy.dispatch = false; render();
    } else if (a === "setstatus") {
      try {
        await gh.put(`state/decisions/${t.dataset.id}-status-${Date.now()}.json`, JSON.stringify({ id: t.dataset.id, action: "status", status: t.dataset.s, decided_at: new Date().toISOString() }), `Trạng thái: ${t.dataset.s}`);
        const it = S.history.items.find((x) => x.id === t.dataset.id); if (it) it.status = t.dataset.s;
        toast("Đã cập nhật"); render();
      } catch (e) { toast(e.message, 5000); }
    } else if (a === "load-kw") {
      try { S.kwText = (await gh.text("keywords.yaml")) || ""; S.kw = JT.kw.parse(S.kwText); S.kwDirty = false; render(); }
      catch (e) { toast(e.message.includes("YAML") || e.name === "YAMLException" ? "File keywords.yaml có lỗi định dạng. Sửa ở mục nâng cao." : e.message, 6000); S.kw = { doc: JT.kw.parse("").doc, header: "" }; render(); }
    } else if (a === "save-kw") {
      try { const txt = $("#kw-text").value; const m = JT.kw.parse(txt); await gh.put("keywords.yaml", txt, "Sửa từ khoá"); S.kwText = txt; S.kw = m; S.kwDirty = false; toast("Đã lưu. Áp dụng từ lần quét tới."); render(); }
      catch (e) { toast(e.name === "YAMLException" ? "Sai định dạng YAML: " + e.message.split("\n")[0] : e.message, 6000); }
    } else if (a && a.startsWith("kw-") && S.kw) {
      const d = S.kw.doc, K = JT.kw, tt = t.dataset.t;
      let err = null;
      if (a === "kw-add") { err = K.addTitle(d, $("#kw-new").value); }
      else if (a === "kw-del") K.removeTitle(d, tt);
      else if (a === "kw-keep") K.keepSuggestion(d, tt);
      else if (a === "kw-drop") K.dropSuggestion(d, tt);
      else if (a === "kw-exadd") err = K.addExclude(d, $("#kw-ex").value);
      else if (a === "kw-exdel") K.removeExclude(d, tt);
      else if (a === "kw-save") {
        S.busy.kw = true; render();
        try {
          const txt = K.dump(S.kw);
          await gh.put("keywords.yaml", txt, "Sửa từ khoá");
          S.kwText = txt; S.kwDirty = false;
          if (t.dataset.scan) { await gh.dispatch("daily.yml"); toast("Đã lưu và yêu cầu quét. Khoảng 5–15 phút sau bấm Làm mới.", 5000); }
          else toast("Đã lưu. AI đề xuất và tìm theo từ khoá mới ở lần quét tới.", 4500);
        } catch (e) { toast(e.message, 6000); }
        S.busy.kw = false; render(); return;
      }
      if (err) return toast(err);
      S.kwDirty = true; S.kwText = K.dump(S.kw); render();
      if (a === "kw-add") $("#kw-new").focus(); else if (a === "kw-exadd") $("#kw-ex").focus();
    }
    else if (a === "load-cfg") { try { S.cfgText = (await gh.text("config.yaml")) || ""; render(); } catch (e) { toast(e.message); } }
    else if (a === "save-cfg") { try { await gh.put("config.yaml", $("#cfg-text").value, "Sửa cấu hình"); toast("Đã lưu cấu hình"); } catch (e) { toast(e.message, 5000); } }
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter") return;
    const map = { "kw-new": "kw-add", "kw-ex": "kw-exadd" };
    const act = map[ev.target.id];
    if (act) { ev.preventDefault(); const b = document.querySelector(`[data-act="${act}"]`); if (b) b.click(); }
  });
  document.addEventListener("input", (ev) => {
    const j = S.queue && S.queue.jobs.find((x) => x.id === S.jobId);
    if (!j) return;
    const e = ed(j), el = ev.target;
    if (el.id === "cover-edit") {
      const blocks = el.value.split(/\n\s*\n/).map((s) => s.trim()).filter(Boolean);
      e.cover = { ...e.cover, greeting: blocks[0] || "", paragraphs: blocks.slice(1) }; e.touched.cover = true;
      $("#cover-checks").innerHTML = checksHtml(core.checkLetter(e.cover.paragraphs, S.cv, j, (j.score_detail || {}).missing || [], S.profile.years_experience), core.bodyWords(e.cover.paragraphs));
    } else if (el.id === "em-body" || el.id === "em-subject" || el.id === "em-to") {
      e.email = { ...e.email, to: $("#em-to").value.trim(), subject: $("#em-subject").value, body: $("#em-body").value };
      $("#em-checks").innerHTML = emailChecks(e.email.body);
    } else if (el.dataset.fv) {
      e.form_values[el.dataset.fv] = el.type === "checkbox" ? el.checked : el.value;
    } else if (el.dataset.edit === "sum") { e.final.summary[+el.dataset.i] = el.value; e.touched.final = true; }
    else if (el.dataset.edit === "bul") { e.final.experience[+el.dataset.k].bullets[+el.dataset.i] = el.value; e.touched.final = true; }
    saveEdits();
  });
    function refreshNeeds() {
    const j = S.queue && S.queue.jobs.find((x) => x.id === S.jobId);
    if (!j || !j.form) return;
    const e = ed(j);
    let n = 0;
    for (const f of j.form.fields.filter((x) => x.kind === "question")) {
      const v = e.form_values[f.sel];
      const need = f.required && (!v || String(v).includes("[ĐIỀN TAY"));
      if (need) n++;
      const el = document.querySelector(`[data-fv="${CSS.escape(f.sel)}"]`);
      const row = el && el.closest(".qrow");
      if (row) { row.classList.toggle("need", need); if (!need) row.querySelectorAll(".warn-line").forEach((w) => w.remove()); }
    }
    const span = document.querySelector(".sticky-actions > span");
    if (span) {
      span.className = "small" + (n ? "" : " muted");
      span.style.color = n ? "var(--bad)" : "";
      span.textContent = n ? `Còn ${n} câu bắt buộc chưa trả lời: tool sẽ dừng ở bước nộp và báo bạn.` : `Duyệt xong, GitHub ${j.apply.method === "manual" ? "lưu hồ sơ và gửi bạn link" : "tự nộp trong 1–3 phút"}.`;
    }
  }
  document.addEventListener("change", (ev) => {
    const t = ev.target;
    if (!(t.dataset.fv || t.dataset.edit)) return;
    t.dispatchEvent(new Event("input", { bubbles: true }));
    if (t.dataset.fv) refreshNeeds();
    else setTimeout(render, 0);  // CV bullet edited: re-check its warnings
  });

  render();
  if (S.gh) load();
})(globalThis.JT = globalThis.JT || {});

</script>
</body></html>
